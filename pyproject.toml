[project]
name = "ai-ml-mcp-servers"
version = "1.0.0"
description = "Full suite of production AI/ML Model Context Protocol (MCP) servers by NaTo1000"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [
    { name = "NaTo1000", email = "Natfunkycat@yahoo.com.au" }
]
keywords = ["mcp", "model-context-protocol", "ai", "ml", "llm", "agents", "huggingface"]
dependencies = [
    "mcp[cli]>=1.0.0",
    "huggingface_hub>=0.26.0",
    "transformers>=4.45.0",
    "torch>=2.4.0",
    "pillow>=10.0.0",
    "numpy>=1.26.0",
    "sentence-transformers>=3.0.0",
    "chromadb>=0.5.0",
    "faiss-cpu>=1.8.0",
    "datasets>=3.0.0",
    "evaluate>=0.4.0",
    "accelerate>=0.34.0",
    "peft>=0.13.0",
    "soundfile>=0.12.0",
    "librosa>=0.10.0",
]

[project.optional-dependencies]
vision = ["torchvision", "opencv-python-headless"]
audio = ["torchaudio", "openai-whisper"]
full = ["torchvision", "opencv-python-headless", "torchaudio", "openai-whisper", "vllm"]

[project.scripts]
mcp-nlp = "servers.nlp.text_analysis:main"
mcp-cv = "servers.cv.vision:main"
mcp-mm = "servers.multimodal.vlm:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["servers"]
